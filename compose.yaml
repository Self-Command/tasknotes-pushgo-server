services:
  server:
    image: ${TASKNOTES_IMAGE:-tasknotes-pushgo:0.1.0}
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      ALLOWED_GATEWAYS: ${ALLOWED_GATEWAYS:?Set gateway allowlist}
      ALLOW_HTTP_GATEWAYS: ${ALLOW_HTTP_GATEWAYS:-false}
      OWNER_PASSWORD_FILE: /run/secrets/owner_password
      ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      GATEWAY_TOKEN_FILE: /run/secrets/gateway_token
    secrets: [owner_password, encryption_key, gateway_token]
    volumes: [tasknotes_data:/data]
    ports: ["127.0.0.1:8787:8787"]
    stop_grace_period: 30s
  proxy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    environment:
      TASKNOTES_DOMAIN: ${TASKNOTES_DOMAIN:-tasks.example.com}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy
volumes:
  tasknotes_data:
  caddy_data:
  caddy_config:
secrets:
  owner_password:
    file: ./secrets/owner_password
  encryption_key:
    file: ./secrets/encryption_key
  gateway_token:
    file: ./secrets/gateway_token
