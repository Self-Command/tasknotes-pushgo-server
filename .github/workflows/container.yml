name: Test and build service image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('service-pr-{0}', github.event.pull_request.number) || 'service-publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Image name and tags
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version=latest
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then version="$GITHUB_REF_NAME"; fi
          printf 'tags=%s:%s,%s:sha-%s\n' "$image" "$version" "$image" "${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        if: github.event_name != 'pull_request'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.image.outputs.tags }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Publish deployment download
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="service-build-$GITHUB_RUN_NUMBER"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; fi
          mkdir -p dist-release/tasknotes-pushgo-server
          cp compose.yaml .env.example README.md LICENSE THIRD-PARTY-NOTICES.md dist-release/tasknotes-pushgo-server/
          cp -r deploy scripts THIRD-PARTY-LICENSES dist-release/tasknotes-pushgo-server/
          sed -i "s|^TASKNOTES_IMAGE=.*|TASKNOTES_IMAGE=$image:sha-${GITHUB_SHA:0:12}|" dist-release/tasknotes-pushgo-server/.env.example
          printf 'commit=%s\nimage=%s:sha-%s\nplatforms=linux/amd64,linux/arm64\n' \
            "$GITHUB_SHA" "$image" "${GITHUB_SHA:0:12}" > dist-release/BUILD_INFO.txt
          tar -czf dist-release/tasknotes-pushgo-server-deploy.tar.gz -C dist-release tasknotes-pushgo-server
          rm -r dist-release/tasknotes-pushgo-server
          (cd dist-release && sha256sum ./* > SHA256SUMS.txt)
          printf '%s\n' \
            '独立 TaskNotes 拍照打卡后端自动构建。部署包不含账号密码、频道密码和网关凭据。' \
            "Docker: $image:latest (linux/amd64, linux/arm64)" \
            '下载部署包，按 README 配置域名、允许的网关和独立密钥后启动。' \
            "Source: $GITHUB_SHA" > release-notes.md
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json targetCommitish --jq .targetCommitish > existing-release.txt; then
            test "$(cat existing-release.txt)" = "$GITHUB_SHA"
          else
            gh release create "$tag" dist-release/* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "TaskNotes PushGo service build $GITHUB_RUN_NUMBER" \
              --notes-file release-notes.md --latest
          fi
